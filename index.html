<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python for Data Analysts — 2 Month Curriculum</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #161616;
    --surface2: #1e1e1e;
    --surface3: #252525;
    --border: #2a2a2a;
    --border2: #333;
    --text: #e8e4dc;
    --text2: #9a9690;
    --text3: #5a5652;
    --accent: #c8a96e;
    --accent2: #e8c98e;
    --green: #6db87a;
    --green-bg: #1a2e1d;
    --blue: #6ba3c8;
    --blue-bg: #1a2535;
    --purple: #9b8fd4;
    --purple-bg: #211e35;
    --orange: #d4845a;
    --orange-bg: #2e1e15;
    --teal: #5ab8b0;
    --teal-bg: #152928;
    --red: #c86b6b;
    --red-bg: #2e1515;
    --font: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
    --serif: 'Fraunces', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Layout ── */
  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: 260px;
    min-width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .logo {
    font-family: var(--serif);
    font-style: italic;
    font-size: 20px;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .logo-sub {
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .progress-wrap {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text3);
    margin-bottom: 6px;
  }

  .progress-bar {
    height: 3px;
    background: var(--border2);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .phase-nav {
    overflow-y: auto;
    flex: 1;
    padding: 8px 0;
  }

  .phase-nav::-webkit-scrollbar { width: 4px; }
  .phase-nav::-webkit-scrollbar-track { background: transparent; }
  .phase-nav::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .phase-section { margin-bottom: 4px; }

  .phase-btn {
    width: 100%;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text2);
    font-family: var(--font);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: left;
    transition: color 0.15s;
  }

  .phase-btn:hover { color: var(--text); }
  .phase-btn.active { color: var(--accent); }

  .phase-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .week-item {
    padding: 6px 20px 6px 36px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text3);
    transition: color 0.15s, background 0.15s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .week-item:hover { color: var(--text2); background: var(--surface2); }
  .week-item.active { color: var(--text); background: var(--surface2); }

  .week-check {
    width: 14px; height: 14px;
    border-radius: 3px;
    border: 1px solid var(--border2);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
  }

  .week-check.done { background: var(--green); border-color: var(--green); color: #0f1a11; }

  /* ── Main ── */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 40px;
    max-width: 900px;
  }

  .main::-webkit-scrollbar { width: 6px; }
  .main::-webkit-scrollbar-track { background: transparent; }
  .main::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* ── Phase header ── */
  .phase-header {
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .phase-eyebrow {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 8px;
  }

  .phase-title {
    font-family: var(--serif);
    font-style: italic;
    font-size: 36px;
    font-weight: 300;
    color: var(--text);
    margin-bottom: 10px;
    line-height: 1.2;
  }

  .phase-desc {
    font-size: 14px;
    color: var(--text2);
    max-width: 600px;
    line-height: 1.7;
  }

  .phase-stats {
    display: flex;
    gap: 24px;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  .phase-stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .phase-stat-val {
    font-size: 22px;
    font-weight: 300;
    color: var(--accent);
    font-family: var(--mono);
  }

  .phase-stat-label {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* ── Week block ── */
  .week-block {
    margin-bottom: 48px;
  }

  .week-header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 20px;
  }

  .week-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.06em;
  }

  .week-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
  }

  .week-tag {
    font-size: 10px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-left: auto;
  }

  /* ── Day card ── */
  .day-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color 0.15s;
  }

  .day-card:hover { border-color: var(--border2); }
  .day-card.open { border-color: var(--border2); }

  .day-card-header {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    user-select: none;
  }

  .day-number {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
    min-width: 44px;
    flex-shrink: 0;
  }

  .day-topic {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .day-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 500;
    flex-shrink: 0;
    letter-spacing: 0.03em;
  }

  .day-chevron {
    color: var(--text3);
    font-size: 10px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }

  .day-card.open .day-chevron { transform: rotate(180deg); }

  .day-body {
    display: none;
    padding: 0 20px 20px;
    border-top: 1px solid var(--border);
  }

  .day-card.open .day-body { display: block; }

  /* Tabs */
  .tab-row {
    display: flex;
    gap: 4px;
    padding: 14px 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .tab-btn {
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: none;
    font-family: var(--font);
    font-size: 11px;
    color: var(--text3);
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
    letter-spacing: 0.03em;
  }

  .tab-btn:hover { border-color: var(--border2); color: var(--text2); }
  .tab-btn.active { background: var(--surface3); border-color: var(--border2); color: var(--text); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Topics list */
  .topic-list { list-style: none; }

  .topic-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--text2);
  }

  .topic-item:last-child { border-bottom: none; }

  .topic-check-btn {
    width: 16px; height: 16px;
    border-radius: 4px;
    border: 1px solid var(--border2);
    background: none;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
    color: transparent;
    transition: all 0.15s;
  }

  .topic-check-btn:hover { border-color: var(--accent); }
  .topic-check-btn.done { background: var(--green); border-color: var(--green); color: #0f1a11; }

  .topic-text { flex: 1; line-height: 1.5; }
  .topic-text.done { text-decoration: line-through; color: var(--text3); }

  /* Practical */
  .practical-box {
    background: var(--surface2);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }

  .practical-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .practical-text {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.7;
  }

  pre.code-block {
    background: var(--surface3);
    border-radius: 8px;
    padding: 16px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    line-height: 1.8;
    overflow-x: auto;
    margin-top: 10px;
    border: 1px solid var(--border);
  }

  .code-comment { color: #5a5652; }
  .code-keyword { color: var(--purple); }
  .code-string { color: var(--green); }
  .code-num { color: var(--orange); }

  /* QnA */
  .qna-item { margin-bottom: 14px; }

  .qna-q {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }

  .qna-q-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    background: var(--orange-bg);
    padding: 2px 6px;
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .qna-a {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.7;
    padding-left: 40px;
  }

  .qna-code {
    font-family: var(--mono);
    background: var(--surface3);
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 11px;
    display: block;
    margin-top: 4px;
    color: var(--text);
    border: 1px solid var(--border);
  }

  /* Assignment */
  .assignment-card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 28px 32px;
    margin-top: 48px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
  }

  .assignment-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--green), var(--blue));
  }

  .assignment-eyebrow {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 10px;
  }

  .assignment-title {
    font-family: var(--serif);
    font-style: italic;
    font-size: 22px;
    color: var(--text);
    margin-bottom: 12px;
    font-weight: 300;
  }

  .assignment-desc {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.8;
    margin-bottom: 16px;
  }

  .assignment-tasks { list-style: none; }

  .assignment-task {
    display: flex;
    gap: 10px;
    padding: 7px 0;
    font-size: 13px;
    color: var(--text2);
    border-bottom: 1px solid var(--border);
    align-items: flex-start;
    line-height: 1.5;
  }

  .assignment-task:last-child { border-bottom: none; }

  .task-num {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    min-width: 20px;
    padding-top: 2px;
  }

  /* Badges by phase */
  .badge-py { background: #1a2535; color: var(--blue); }
  .badge-np { background: var(--green-bg); color: var(--green); }
  .badge-pd { background: var(--purple-bg); color: var(--purple); }
  .badge-mp { background: var(--orange-bg); color: var(--orange); }
  .badge-sq { background: var(--teal-bg); color: var(--teal); }
  .badge-proj { background: var(--red-bg); color: var(--red); }

  .tag-py { background: #1a2535; color: var(--blue); }
  .tag-np { background: var(--green-bg); color: var(--green); }
  .tag-pd { background: var(--purple-bg); color: var(--purple); }
  .tag-mp { background: var(--orange-bg); color: var(--orange); }
  .tag-sq { background: var(--teal-bg); color: var(--teal); }

  .phase-dot-py { background: var(--blue); }
  .phase-dot-np { background: var(--green); }
  .phase-dot-pd { background: var(--purple); }
  .phase-dot-mp { background: var(--orange); }
  .phase-dot-sq { background: var(--teal); }

  /* Misc */
  .warn-inline {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--orange-bg);
    color: var(--orange);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 5px;
    margin-bottom: 8px;
    font-weight: 500;
  }

  .tip-inline {
    background: var(--green-bg);
    color: var(--green);
    font-size: 12px;
    padding: 10px 14px;
    border-radius: 7px;
    margin-top: 10px;
    line-height: 1.6;
    border-left: 2px solid var(--green);
  }

  .section-divider {
    height: 1px;
    background: var(--border);
    margin: 16px 0;
  }

  /* Mobile */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main { padding: 20px 16px; }
  }
</style>
</head>
<body>
<div class="app">

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-header">
    <div class="logo">Python for Analysts</div>
    <div class="logo-sub">2 months · 40 lectures · beginner</div>
  </div>
  <div class="progress-wrap">
    <div class="progress-label">
      <span>Progress</span>
      <span id="prog-label">0 / 40</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="prog-fill" style="width:0%"></div>
    </div>
  </div>
  <nav class="phase-nav" id="phase-nav"></nav>
</div>

<!-- Main -->
<main class="main" id="main-content"></main>

</div>

<script>
// ─────────────────────────────────────────────
//  DATA
// ─────────────────────────────────────────────
const curriculum = [
  {
    id: 'phase1',
    label: 'Phase 1 — Python',
    color: 'py',
    desc: 'Complete Python fundamentals. No jargon, no rush. Every concept tied to real data examples. By the end, students can write complete programs using variables, loops, conditions, collections, and functions.',
    stats: [{ val:'3', label:'Weeks' }, { val:'15', label:'Lectures' }, { val:'1', label:'Project' }],
    weeks: [
      {
        id:'w1', label:'Week 1', title:'Think like Python', tag:'py',
        days: [
          {
            id:'d1', num:'Day 01', topic:'Data types + fixing the string/char confusion', badge:'py',
            topics:['Python vs other tools — why analysts use it','Variables: dynamic typing, no declaration needed','5 core types: int, float, str, bool, None','type() function — inspect any value','The char fix: Python has NO char type','f-strings: f"Hello {name}"','print() and basic output'],
            practical:'Create a "profile card" program. Store your name, age, city, GPA as variables. Print a formatted card using f-strings. Bonus: print your name in ALL CAPS using .upper()',
            qna:[
              {q:'Python has no char type — what is "a" then?', a:'It is a str of length 1. Run type("a") and type("hello") — both return <class "str">. Python simply does not distinguish.', code:null},
              {q:'What is None?', a:'None means "no value" — like null in other languages. Type is NoneType. Used when a variable exists but has nothing in it yet.', code:'result = None\nprint(result is None)  # True'},
              {q:'Why use f-strings instead of + for joining strings?', a:'Cleaner and handles type conversion automatically. "Age: " + age breaks if age is an int. f"Age: {age}" works always.', code:null},
            ]
          },
          {
            id:'d2', num:'Day 02', topic:'Variables, input() and string operations', badge:'py',
            topics:['Variable naming rules (snake_case)','input() always returns a string — the #1 beginner bug','int(input()) and float(input()) conversions','String methods: upper, lower, strip, replace, split, title','len() — length of a string or list','String slicing: s[0:3], s[-1]'],
            practical:'Name formatter: take a user\'s full name (may have extra spaces), their birth year. Print: clean Title Case name, their age (2025 - year), their initials, character count without spaces.',
            qna:[
              {q:'Why does input() + 10 throw a TypeError?', a:'input() returns a string always. "21" + 10 is str + int which Python cannot do. Convert first: int(input())', code:'age = int(input("Enter age: "))\nprint(age + 10)  # works'},
              {q:'What does strip() do?', a:'Removes leading and trailing whitespace (spaces, tabs, newlines). Very common in data cleaning to fix messy text.', code:'"  hello  ".strip()  # "hello"'},
              {q:'How do I check if a string contains a word?', a:'Use the in keyword. Returns True or False.', code:'"python" in "I love python"  # True'},
            ]
          },
          {
            id:'d3', num:'Day 03', topic:'Numbers, casting and operators', badge:'py',
            topics:['int vs float — when division returns which','// floor division, ** power, % modulo','Casting: int(), float(), str(), round()','round() vs int() — important difference','Operator precedence: BODMAS still applies','f-string number formatting: :.2f, :,'],
            practical:'Build a bill splitter: take total bill, number of people, tip %. Calculate tip amount, grand total, and per-person share. Format all outputs with ₹ and 2 decimal places.',
            qna:[
              {q:'int(89.9) gives 89 not 90 — why?', a:'int() truncates — chops the decimal. It does NOT round. Use round() when you want rounding. int() is for when you want the integer part only.', code:'int(89.9)    # 89\nround(89.9)  # 90'},
              {q:'What is 7 // 2?', a:'Floor division — gives the whole number part of the division. 7 // 2 = 3. Remainder: 7 % 2 = 1. Together: 7 = (3 × 2) + 1', code:null},
              {q:'How to print a number with commas (like 1,00,000)?', a:'Use :, in f-strings for international format. Python follows US convention (1,000,000).', code:'print(f"{1000000:,}")  # 1,000,000\nprint(f"{price:.2f}")  # 2 decimals'},
            ]
          },
          {
            id:'d4', num:'Day 04', topic:'Booleans, comparisons and if/elif/else', badge:'py',
            topics:['True and False — capital matters','Comparison: ==, !=, >, <, >=, <=','Logical: and, or, not','Truthy/falsy: 0, "", [], {}, None are False','if / elif / else — only one branch runs','Ternary: "Pass" if score >= 40 else "Fail"','Order of conditions matters'],
            practical:'Job eligibility checker: ask age (18–35), marks % (>=60), years experience (>=2), driving licence (yes/no). Check all conditions and print which criteria passed or failed.',
            qna:[
              {q:'if marks == 75 or 80 — why does this not work?', a:'Python reads this as (marks == 75) or (80). Since 80 is truthy, this is always True! Must write: marks == 75 or marks == 80', code:'# Wrong:\nif marks == 75 or 80:\n# Correct:\nif marks == 75 or marks == 80:'},
              {q:'What is falsy in Python?', a:'Values that act like False in conditions: 0, 0.0, "" (empty string), [] (empty list), {} (empty dict), None. Everything else is truthy.', code:'if []:   # False — empty list\nif [0]:  # True — list has one item'},
              {q:'Can I write 40 <= marks <= 100 in Python?', a:'Yes! Python supports chained comparisons. This is cleaner than marks >= 40 and marks <= 100.', code:'if 0 <= age <= 120:  # valid Python'},
            ]
          },
          {
            id:'d5', num:'Day 05', topic:'Loops — for and while', badge:'py',
            topics:['for loop with range(start, stop, step)','Looping over a list directly','enumerate() — index + value together','while loop — use when count is unknown','break and continue','range() vs list iteration — when to use which','Nested loops briefly'],
            practical:'Marks analyser: given a fixed list of 10 marks, use a for loop (no built-in sum/max/min) to find total, average, highest, lowest, pass count, fail count, and list all marks below 50 with their position.',
            qna:[
              {q:'range(5) starts from 0 but I want 1 to 5?', a:'range(5) gives 0,1,2,3,4. range(1,6) gives 1,2,3,4,5. Remember: stop is excluded.', code:'for i in range(1, 6):\n    print(i)  # 1 2 3 4 5'},
              {q:'When to use for vs while?', a:'for: when you know what to loop over (a list, a range). while: when you loop until a condition changes (user input, retry, wait). Default to for unless you need while.', code:null},
              {q:'What does enumerate() give me?', a:'Both the index and value together. Much cleaner than maintaining a counter variable.', code:'for i, name in enumerate(names):\n    print(f"{i+1}. {name}")'},
            ]

            topics:['Student presentations: 5 minutes each','Peer feedback: one thing they liked, one suggestion','Teacher feedback: technical correctness + storytelling','What to learn next: SQL deeper, Power BI, Statistics, Scikit-learn','Building a portfolio on GitHub','How to describe this project in a job interview'],
            practical:'Each student presents their capstone (5 min). Class gives structured feedback. Teacher shows how to push the notebook to GitHub Pages as a portfolio piece. End with a roadmap: what a junior data analyst learns in their first 6 months on the job.',
            qna:[
              {q:'What should I learn after this course?', a:'1. SQL deeper — JOIN types, subqueries, CTEs, window functions. 2. Statistics for analysts — hypothesis testing, A/B testing basics. 3. Power BI or Tableau for dashboards. 4. Scikit-learn basics — linear regression, classification. 5. Git and GitHub.', code:null},
              {q:'How do I describe this project in an interview?', a:'"I built an end-to-end data analysis pipeline in Python using Pandas and Matplotlib. I cleaned a dataset of X rows, performed [specific analyses], and built a dashboard answering [specific business questions]. The key finding was [insight]."', code:null},
              {q:'What SQL topics are most important for an analyst?', a:'GROUP BY with HAVING, all JOIN types (especially LEFT), subqueries, CTEs (WITH clause), window functions (ROW_NUMBER, RANK, LAG), date functions. These cover 90% of analyst interview SQL questions.', code:null},
            ]
          },
        ],
        assignment: {
          title:'Final capstone project — end-to-end data analysis',
          desc:'A complete, job-portfolio-ready analysis project on a real dataset of the student\'s choice.',
          tasks:['Choose a real dataset (min 1000 rows, at least 5 columns)','Write 5 specific business questions before starting','Full cleaning pipeline — zero nulls, correct dtypes, no duplicates','GroupBy analysis answering all 5 business questions','4-chart dashboard in a single matplotlib figure','SQL: at least 2 of the 5 questions answered using sqlite3','Jupyter notebook with markdown explanations, not just code','Push to GitHub — this is your portfolio piece']
        }
      }
    ]
  }
];

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let currentPhase = 'phase1';
let checkedTopics = JSON.parse(localStorage.getItem('py_checked') || '{}');
let openDays = {};
let activeTabs = {};

function saveChecked() {
  localStorage.setItem('py_checked', JSON.stringify(checkedTopics));
}

function totalTopics() {
  let t = 0;
  curriculum.forEach(p => p.weeks.forEach(w => w.days.forEach(d => t += d.topics.length)));
  return t;
}

function doneTopics() {
  return Object.values(checkedTopics).filter(Boolean).length;
}

// ─────────────────────────────────────────────
//  SIDEBAR
// ─────────────────────────────────────────────
function buildSidebar() {
  const nav = document.getElementById('phase-nav');
  nav.innerHTML = curriculum.map(phase => `
    <div class="phase-section">
      <button class="phase-btn ${phase.id === currentPhase ? 'active' : ''} p-${phase.color}"
              onclick="setPhase('${phase.id}')">
        <span class="phase-dot phase-dot-${phase.color}"></span>
        ${phase.label}
      </button>
      ${phase.weeks.map(w => {
        const wDone = w.days.every(d => d.topics.every((_, ti) => checkedTopics[`${d.id}-${ti}`]));
        return `
        <div class="week-item ${phase.id === currentPhase ? '' : 'dimmed'}"
             onclick="setPhase('${phase.id}'); scrollToWeek('${w.id}')">
          ${w.label} — ${w.title}
          <span class="week-check ${wDone ? 'done' : ''}">✓</span>
        </div>`;
      }).join('')}
    </div>
  `).join('');
}

function updateProgress() {
  const done = doneTopics();
  const total = totalTopics();
  const pct = Math.round(done / total * 100);
  document.getElementById('prog-label').textContent = `${done} / ${total}`;
  document.getElementById('prog-fill').style.width = pct + '%';
}

// ─────────────────────────────────────────────
//  MAIN CONTENT
// ─────────────────────────────────────────────
function buildMain() {
  const phase = curriculum.find(p => p.id === currentPhase);
  const main = document.getElementById('main-content');

  main.innerHTML = `
    <div class="phase-header">
      <div class="phase-eyebrow">Phase ${curriculum.indexOf(phase) + 1} of ${curriculum.length}</div>
      <div class="phase-title">${phase.label}</div>
      <div class="phase-desc">${phase.desc}</div>
      <div class="phase-stats">
        ${phase.stats.map(s => `
          <div class="phase-stat">
            <div class="phase-stat-val">${s.val}</div>
            <div class="phase-stat-label">${s.label}</div>
          </div>
        `).join('')}
      </div>
    </div>
    ${phase.weeks.map(w => buildWeek(w)).join('')}
  `;
}

function buildWeek(week) {
  return `
    <div class="week-block" id="${week.id}">
      <div class="week-header">
        <span class="week-num">${week.label}</span>
        <span class="week-title">${week.title}</span>
        <span class="week-tag tag-${week.tag}">${week.tag.toUpperCase()}</span>
      </div>
      ${week.days.map(d => buildDayCard(d)).join('')}
      ${buildAssignment(week.assignment)}
    </div>
  `;
}

function buildDayCard(day) {
  const isOpen = openDays[day.id];
  const activeTab = activeTabs[day.id] || 'topics';
  return `
    <div class="day-card ${isOpen ? 'open' : ''}" id="card-${day.id}">
      <div class="day-card-header" onclick="toggleDay('${day.id}')">
        <span class="day-number">${day.num}</span>
        <span class="day-topic">${day.topic}</span>
        <span class="day-badge badge-${day.badge}">${day.badge.toUpperCase()}</span>
        <span class="day-chevron">▼</span>
      </div>
      <div class="day-body">
        <div class="tab-row">
          ${['topics','practical','qna'].map(t => `
            <button class="tab-btn ${activeTab === t ? 'active' : ''}"
                    onclick="setTab('${day.id}','${t}')">
              ${t.charAt(0).toUpperCase() + t.slice(1)}
            </button>
          `).join('')}
        </div>
        <div class="tab-content ${activeTab === 'topics' ? 'active' : ''}" id="${day.id}-topics">
          ${buildTopics(day)}
        </div>
        <div class="tab-content ${activeTab === 'practical' ? 'active' : ''}" id="${day.id}-practical">
          ${buildPractical(day)}
        </div>
        <div class="tab-content ${activeTab === 'qna' ? 'active' : ''}" id="${day.id}-qna">
          ${buildQnA(day)}
        </div>
      </div>
    </div>
  `;
}

function buildTopics(day) {
  return `<ul class="topic-list">
    ${day.topics.map((t, i) => {
      const key = `${day.id}-${i}`;
      const done = checkedTopics[key];
      return `<li class="topic-item">
        <button class="topic-check-btn ${done ? 'done' : ''}"
                onclick="toggleTopic('${day.id}',${i})">✓</button>
        <span class="topic-text ${done ? 'done' : ''}">${t}</span>
      </li>`;
    }).join('')}
  </ul>`;
}

function buildPractical(day) {
  return `
    <div class="practical-box">
      <div class="practical-label">Exercise</div>
      <div class="practical-text">${day.practical}</div>
    </div>
  `;
}

function buildQnA(day) {
  return day.qna.map((q, i) => `
    <div class="qna-item">
      <div class="qna-q">
        <span class="qna-q-label">Q${i+1}</span>
        ${q.q}
      </div>
      <div class="qna-a">
        ${q.a}
        ${q.code ? `<code class="qna-code">${q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code>` : ''}
      </div>
    </div>
  `).join('');
}

function buildAssignment(a) {
  return `
    <div class="assignment-card">
      <div class="assignment-eyebrow">Weekly Assignment</div>
      <div class="assignment-title">${a.title}</div>
      <div class="assignment-desc">${a.desc}</div>
      <ul class="assignment-tasks">
        ${a.tasks.map((t, i) => `
          <li class="assignment-task">
            <span class="task-num">${String(i+1).padStart(2,'0')}.</span>
            ${t}
          </li>
        `).join('')}
      </ul>
    </div>
  `;
}

// ─────────────────────────────────────────────
//  INTERACTIONS
// ─────────────────────────────────────────────
function setPhase(id) {
  currentPhase = id;
  buildSidebar();
  buildMain();
  document.getElementById('main-content').scrollTop = 0;
}

function toggleDay(id) {
  openDays[id] = !openDays[id];
  const card = document.getElementById(`card-${id}`);
  card.classList.toggle('open', openDays[id]);
  card.querySelector('.day-body').style.display = openDays[id] ? 'block' : 'none';
}

function setTab(dayId, tab) {
  activeTabs[dayId] = tab;
  const body = document.querySelector(`#card-${dayId} .day-body`);
  body.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim().toLowerCase() === tab);
  });
  body.querySelectorAll('.tab-content').forEach(c => {
    c.classList.toggle('active', c.id === `${dayId}-${tab}`);
  });
}

function toggleTopic(dayId, idx) {
  const key = `${dayId}-${idx}`;
  checkedTopics[key] = !checkedTopics[key];
  saveChecked();
  updateProgress();
  // Update the specific button
  const card = document.getElementById(`card-${dayId}`);
  if (!card) return;
  const items = card.querySelectorAll('.topic-item');
  if (items[idx]) {
    const btn = items[idx].querySelector('.topic-check-btn');
    const txt = items[idx].querySelector('.topic-text');
    btn.classList.toggle('done', checkedTopics[key]);
    txt.classList.toggle('done', checkedTopics[key]);
  }
  buildSidebar();
}

function scrollToWeek(weekId) {
  setTimeout(() => {
    const el = document.getElementById(weekId);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
buildSidebar();
buildMain();
updateProgress();

// Re-apply open state after build
document.querySelectorAll('.day-body').forEach(b => b.style.display = 'none');
</script>
</body>
</html>
