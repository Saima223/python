<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python for Data Analysts — Complete Curriculum</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafaf8;--surface:#ffffff;--surface2:#f4f3ef;--surface3:#ece9e2;
  --border:#e2dfd8;--border2:#d0ccc3;
  --ink:#1a1916;--ink2:#5a5750;--ink3:#9a9490;
  --py:#2563eb;--py-bg:#eff6ff;--py-light:#dbeafe;
  --np:#16a34a;--np-bg:#f0fdf4;--np-light:#dcfce7;
  --mp:#d97706;--mp-bg:#fffbeb;--mp-light:#fef3c7;
  --pd:#7c3aed;--pd-bg:#faf5ff;--pd-light:#ede9fe;
  --accent:#e85d3a;
  --font:'Syne',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --serif:'Instrument Serif',serif;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}

/* ── LAYOUT ── */
.wrap{display:flex;min-height:100vh}
.sidebar{width:280px;min-width:280px;background:var(--ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.main{flex:1;overflow-y:auto;max-width:900px;padding:48px 48px 80px}

/* ── SIDEBAR ── */
.sb-head{padding:28px 24px 20px}
.sb-logo{font-family:var(--serif);font-style:italic;font-size:22px;color:#fff;margin-bottom:2px}
.sb-sub{font-size:10px;color:#666;letter-spacing:0.1em;text-transform:uppercase}
.sb-stats{display:flex;gap:12px;padding:12px 24px;border-top:1px solid #2a2a2a;border-bottom:1px solid #2a2a2a;flex-shrink:0}
.sb-stat{text-align:center}
.sb-stat-n{font-size:20px;font-weight:700;color:#fff;font-family:var(--mono)}
.sb-stat-l{font-size:9px;color:#555;text-transform:uppercase;letter-spacing:0.06em}

.sb-prog{padding:14px 24px;border-bottom:1px solid #2a2a2a;flex-shrink:0}
.sb-prog-row{display:flex;justify-content:space-between;font-size:10px;color:#555;margin-bottom:6px;letter-spacing:0.04em}
.sb-prog-bar{height:3px;background:#2a2a2a;border-radius:2px;overflow:hidden}
.sb-prog-fill{height:100%;background:linear-gradient(90deg,var(--py),var(--np),var(--pd));border-radius:2px;transition:width .4s}

.sb-nav{overflow-y:auto;flex:1;padding:8px 0 24px}
.sb-nav::-webkit-scrollbar{width:3px}
.sb-nav::-webkit-scrollbar-track{background:transparent}
.sb-nav::-webkit-scrollbar-thumb{background:#333;border-radius:2px}

.sb-track{padding:8px 24px 4px;font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#444}
.sb-item{display:flex;align-items:center;gap:10px;padding:6px 24px;cursor:pointer;transition:background .15s;border-left:2px solid transparent}
.sb-item:hover{background:#1a1a1a}
.sb-item.active{background:#1a1a1a;border-left-color:var(--accent)}
.sb-item-num{font-family:var(--mono);font-size:10px;color:#444;min-width:22px;flex-shrink:0}
.sb-item-label{font-size:12px;color:#999;line-height:1.3;flex:1}
.sb-item.active .sb-item-label{color:#fff}
.sb-check{width:14px;height:14px;border-radius:3px;border:1px solid #333;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px}
.sb-check.done{background:var(--np);border-color:var(--np);color:#fff}

/* ── PAGE HEADER ── */
.pg-header{margin-bottom:40px}
.pg-eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pg-track-badge{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:3px 10px;border-radius:20px}
.badge-py{background:var(--py-light);color:var(--py)}
.badge-np{background:var(--np-light);color:var(--np)}
.badge-mp{background:var(--mp-light);color:var(--mp)}
.badge-pd{background:var(--pd-light);color:var(--pd)}
.pg-num{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.pg-title{font-family:var(--serif);font-style:italic;font-size:40px;color:var(--ink);line-height:1.1;margin-bottom:8px}
.pg-subtitle{font-size:13px;color:var(--ink2);font-weight:400}
.pg-divider{height:1px;background:var(--border);margin-top:24px}

/* ── TABS ── */
.tab-row{display:flex;gap:4px;margin-bottom:28px;border-bottom:2px solid var(--border);padding-bottom:0}
.tab-btn{padding:8px 18px;font-family:var(--font);font-size:12px;font-weight:600;color:var(--ink3);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;letter-spacing:0.02em;transition:color .15s}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--ink)}
.tab-content{display:none}
.tab-content.active{display:block}

/* ── TOPICS ── */
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.topic-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border);cursor:pointer;transition:border-color .15s}
.topic-item:hover{border-color:var(--border2)}
.topic-cb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .15s}
.topic-cb.done{background:var(--np);border-color:var(--np);color:#fff}
.topic-txt{font-size:12px;color:var(--ink2);line-height:1.4;flex:1}
.topic-txt.done{text-decoration:line-through;color:var(--ink3)}

/* ── QNA ── */
.qna-list{display:flex;flex-direction:column;gap:0}
.qna-item{border-bottom:1px solid var(--border);padding:20px 0}
.qna-item:last-child{border-bottom:none}
.qna-q{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.qna-q-tag{background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;flex-shrink:0;margin-top:1px;font-family:var(--mono)}
.qna-q-text{font-size:14px;font-weight:600;color:var(--ink);line-height:1.5}
.qna-a{font-size:13px;color:var(--ink2);line-height:1.7;padding-left:44px;margin-bottom:8px}
.qna-code{font-family:var(--mono);font-size:11.5px;background:var(--ink);color:#d4d0c8;padding:14px 16px;border-radius:8px;margin-left:44px;line-height:1.8;overflow-x:auto;white-space:pre;border:1px solid #2a2a2a}
.code-comment{color:#666}
.code-kw{color:#82aaff}
.code-str{color:#c3e88d}
.code-num{color:#f78c6c}
.code-fn{color:#89ddff}

/* ── ASSIGNMENT ── */
.assign-card{background:var(--ink);border-radius:14px;padding:32px 36px;margin-top:8px;position:relative;overflow:hidden}
.assign-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--py),var(--np),var(--pd))}
.assign-eyebrow{font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#555;margin-bottom:10px}
.assign-title{font-family:var(--serif);font-style:italic;font-size:24px;color:#fff;margin-bottom:10px}
.assign-desc{font-size:13px;color:#888;line-height:1.7;margin-bottom:20px}
.assign-tasks{list-style:none}
.assign-task{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #252525;font-size:13px;color:#aaa;align-items:flex-start;line-height:1.5}
.assign-task:last-child{border-bottom:none}
.assign-task-n{font-family:var(--mono);font-size:10px;color:#444;min-width:24px;padding-top:2px;flex-shrink:0}

/* ── NAV CONTROLS ── */
.pg-nav{display:flex;justify-content:space-between;align-items:center;margin-top:48px;padding-top:28px;border-top:1px solid var(--border)}
.nav-btn{display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);cursor:pointer;font-family:var(--font);font-size:13px;font-weight:600;color:var(--ink2);transition:all .15s}
.nav-btn:hover{border-color:var(--ink);color:var(--ink)}
.nav-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.nav-btn.primary:hover{background:#333}
.nav-btn:disabled{opacity:0.3;cursor:not-allowed}
.pg-pos{font-size:12px;color:var(--ink3);font-family:var(--mono)}

/* ── WELCOME SCREEN ── */
.welcome{padding:0}
.welcome-hero{background:var(--ink);border-radius:16px;padding:48px;margin-bottom:32px;position:relative;overflow:hidden}
.welcome-hero::after{content:'';position:absolute;bottom:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,0.02)}
.welcome-tag{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#555;margin-bottom:16px}
.welcome-title{font-family:var(--serif);font-style:italic;font-size:48px;color:#fff;line-height:1.1;margin-bottom:14px}
.welcome-desc{font-size:15px;color:#888;line-height:1.7;max-width:500px}
.welcome-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:32px}
.track-card{border-radius:12px;padding:24px;border:1px solid var(--border)}
.tc-py{background:var(--py-bg);border-color:var(--py-light)}
.tc-np{background:var(--np-bg);border-color:var(--np-light)}
.tc-mp{background:var(--mp-bg);border-color:var(--mp-light)}
.tc-pd{background:var(--pd-bg);border-color:var(--pd-light)}
.tc-title{font-size:15px;font-weight:700;margin-bottom:4px}
.tc-py .tc-title{color:var(--py)}
.tc-np .tc-title{color:var(--np)}
.tc-mp .tc-title{color:var(--mp)}
.tc-pd .tc-title{color:var(--pd)}
.tc-sub{font-size:12px;color:var(--ink2);margin-bottom:12px}
.tc-mods{font-size:11px;color:var(--ink3)}
.start-btn{width:100%;padding:14px;border-radius:10px;background:var(--ink);color:#fff;border:none;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;letter-spacing:0.02em;transition:background .15s}
.start-btn:hover{background:#333}

@media(max-width:900px){
  .sidebar{display:none}
  .main{padding:24px 16px 60px}
  .topic-grid{grid-template-columns:1fr}
  .welcome-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">

<aside class="sidebar" id="sidebar">
  <div class="sb-head">
    <div class="sb-logo">Python for Analysts</div>
    <div class="sb-sub">Complete Curriculum · 23 Modules</div>
  </div>
  <div class="sb-stats">
    <div class="sb-stat"><div class="sb-stat-n">23</div><div class="sb-stat-l">Modules</div></div>
    <div class="sb-stat"><div class="sb-stat-n" id="done-n">0</div><div class="sb-stat-l">Done</div></div>
    <div class="sb-stat"><div class="sb-stat-n" id="pct-n">0%</div><div class="sb-stat-l">Progress</div></div>
  </div>
  <div class="sb-prog">
    <div class="sb-prog-row"><span>COMPLETION</span><span id="prog-label">0 / 0 topics</span></div>
    <div class="sb-prog-bar"><div class="sb-prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <nav class="sb-nav" id="sb-nav"></nav>
</aside>

<main class="main" id="main-content">
  <div id="page-welcome"></div>
  <div id="page-module" style="display:none"></div>
</main>

</div>

<script>
const MODULES = [
  {id:"m01",num:"01",title:"Python Fundamentals",subtitle:"Intro, Syntax, Comments, Variables",track:"py",
   topics:["What is Python and why data analysts use it","Installing Python, VS Code, and running your first script","Python syntax: indentation as blocks (no curly braces)","print() — the first function everyone learns","Comments: # single line and ''' triple quote docstrings '''","Variables: dynamic typing — no type declaration needed","Variable naming conventions: snake_case","Multiple assignment: a, b = 1, 2","del keyword to remove a variable","The id() function — checking object identity","Python as a calculator: basic math in REPL"],
   qna:[
     {q:"Why doesn't Python use { } for code blocks?",a:"Python uses indentation (4 spaces or 1 tab) to define blocks. This forces readable code — a wrong indent is a SyntaxError. There is no choice: Python's style IS the language.",code:"if x > 0:\n    print(x)   # indented = inside block\nprint('done')  # not indented = outside block"},
     {q:"What is dynamic typing?",a:"Python figures out the type at runtime from the value you assign. You don't write 'int x = 5'. Just write x = 5 and Python creates an int. The same variable can hold a different type later.",code:"x = 5        # x is now int\nprint(type(x))  # <class 'int'>\nx = 'hello'  # x is now str — legal!\nprint(type(x))  # <class 'str'>"},
     {q:"What is the difference between # and ''' for comments?",a:"# is an inline comment — everything after it on that line is ignored. ''' triple quotes create a multi-line string (not a true comment) that is typically used as a docstring to document a function or module.",code:"# This is a comment\n\ndef analyse(data):\n    '''\n    This function analyses data.\n    Returns a summary dict.\n    '''\n    pass"},
     {q:"When should I use del?",a:"del removes the binding between a variable name and its object. The object gets garbage collected if nothing else refers to it. Rarely needed in normal code — mostly used to free large datasets from memory.",code:"large_data = [x for x in range(1_000_000)]\n# ... use large_data ...\ndel large_data  # free memory\n# print(large_data)  # NameError now"}
   ],
   assignment:{title:"Hello Data World",desc:"Write a Python script that introduces yourself as a data analyst.",tasks:["Create 5 variables: name (str), age (int), city (str), experience (float), is_employed (bool)","Print a formatted introduction card using each variable","Add a triple-quote docstring at the top describing the script's purpose","Use multiple assignment: track, level = 'Data Analytics', 'Beginner'","Print type() and id() of each variable in a loop","Demonstrate that two variables assigned the same string literal share an id (small string interning)"]}
  },
  {id:"m02",num:"02",title:"Data Types & Numbers",subtitle:"Data Types, Numbers, Casting",track:"py",
   topics:["5 core types: int, float, str, bool, None","type() to inspect any value","isinstance() for type checking","int: whole numbers, arbitrary precision in Python 3","float: IEEE 754, precision issues with 0.1+0.2","Arithmetic: +, -, *, /, //, %, **","round(), abs(), divmod()","Casting: int(), float(), str(), bool()","int() truncates (does NOT round)","NaN and infinity in float","Complex numbers: 3+4j (brief)","The decimal module for financial precision"],
   qna:[
     {q:"Why does 0.1 + 0.2 not equal 0.3?",a:"Floats use binary (base-2) representation internally. 0.1 cannot be stored exactly in binary — similar to 1/3 in decimal. Use round() for display or the decimal module for financial calculations.",code:"print(0.1 + 0.2)          # 0.30000000000000004\nprint(round(0.1+0.2, 2))  # 0.3\n\nfrom decimal import Decimal\nDecimal('0.1') + Decimal('0.2')  # Exactly 0.3"},
     {q:"int() truncates — but what exactly does that mean?",a:"int() removes the decimal part by moving toward zero. It does NOT round. 89.9 becomes 89. -3.9 becomes -3 (toward zero, not -4). Use round() when you want proper rounding.",code:"int(89.9)     # 89  — decimal dropped\nint(-3.9)     # -3  — toward zero!\nround(89.9)   # 90  — properly rounded\nround(-3.9)   # -4  — properly rounded"},
     {q:"What is None and how is it different from 0 or ''?",a:"None means 'no value exists'. 0 means the value zero. '' means empty text. None is its own type (NoneType). Always check for None with 'is None', not == None.",code:"result = None           # no value yet\nprint(result is None)   # True — correct check\nprint(result == None)   # True but avoid this\nprint(bool(None))       # False — falsy"},
     {q:"What does divmod() return?",a:"divmod(a, b) returns (quotient, remainder) as a tuple — equivalent to (a//b, a%b) but computed in one operation. Useful for converting seconds to hours/minutes, or checking even/odd.",code:"q, r = divmod(17, 5)\nprint(q, r)  # 3 2   meaning: 17 = 3×5 + 2\n\n# Convert seconds to h:m:s\ntotal = 3661\nh, rem = divmod(total, 3600)\nm, s = divmod(rem, 60)\nprint(f'{h}h {m}m {s}s')  # 1h 1m 1s"}
   ],
   assignment:{title:"Financial Calculator",desc:"Build a calculator demonstrating all number operations.",tasks:["Loan calculator: principal, rate%, years → simple interest, compound interest, monthly EMI","Format all money with ₹ symbol, commas, 2 decimal places: f'{amount:,.2f}'","Use divmod() to express loan duration in 'X years Y months' format","Demonstrate float precision issue (0.1+0.2) and fix with round() and Decimal","Tax calculator: income → tax using slabs (if/elif: 0% up to 2.5L, 5% up to 5L, 10% up to 10L, 20% above)","Use isinstance() to validate that all inputs are the correct type before computing"]}
  },
  {id:"m03",num:"03",title:"Strings & Formatting",subtitle:"Strings, String Formatting, User Input",track:"py",
   topics:["String creation: single, double, triple quotes","String immutability — cannot modify in place","Indexing: s[0], s[-1]","Slicing: s[start:stop:step]","Key methods: upper, lower, strip, lstrip, rstrip, split, join, replace, find, count","startswith(), endswith(), in operator","f-strings: f'{name}' and f'{value:.2f}'","format() method","String alignment: ljust, rjust, center, zfill","input() always returns a string","String multiplication: '-' * 40","Escape characters: \\n, \\t, \\\\"],
   qna:[
     {q:"Python has no char type — what is 'a' then?",a:"Python has NO char type. A single character 'a' is simply a string (str) of length 1. type('a') returns str — exactly the same as type('hello'). There is only one type for all text.",code:"print(type('a'))      # <class 'str'>\nprint(type('hello'))  # <class 'str'>\nprint(len('a'))       # 1\nprint(len('hello'))   # 5"},
     {q:"Why can't I change a character in a string?",a:"Strings are immutable — you cannot modify them in place. s[0] = 'X' raises a TypeError. To 'change' a string, create a new one from the old.",code:"s = 'hello'\n# s[0] = 'H'         # TypeError!\ns = 'H' + s[1:]       # new string: 'Hello'\ns = s.replace('h','H') # also creates new string"},
     {q:"What does split() return and how is join() the opposite?",a:"split() breaks a string into a list. join() combines a list back into a string. They are exact inverses. The separator goes before .join() — this confuses beginners.",code:"sentence = 'one,two,three'\nwords = sentence.split(',')    # ['one','two','three']\nback = ','.join(words)         # 'one,two,three'\n\ntext = '  hello world  '\nwords = text.strip().split()   # ['hello','world']"},
     {q:"How do I format numbers professionally in f-strings?",a:"Use format specifications after the colon inside {}. :.2f for 2 decimals, :, for thousands, :% for percentage, :>10 for right-align in 10 chars.",code:"price = 1234567.891\nprint(f'{price:,.2f}')    # 1,234,567.89\nprint(f'{0.8567:.1%}')   # 85.7%\nprint(f'{\"hi\":>10}')    # '        hi'\nprint(f'{42:05d}')       # 00042"}
   ],
   assignment:{title:"Report Formatter",desc:"Build a student report formatter from raw input.",tasks:["Take: name (may have extra spaces), marks (int), city, year of birth via input()","Clean name: strip() + title(). Compute age from year. Convert marks to float.","Print a 44-char separator line using '-'*44","Print a formatted report card with aligned columns: name left-aligned in 20 chars, marks right-aligned in 5 chars","Show marks as percentage (:.1f%) and letter grade (A+/A/B/C/F)","Print 'RANK: TOP X%' using round() — e.g. 88 marks → 'TOP 20%' if 80th percentile","Bonus: use zfill to show student ID as 6-digit padded number"]}
  },
  {id:"m04",num:"04",title:"Booleans & Operators",subtitle:"Booleans, Operators, If...Else, Match",track:"py",
   topics:["True and False — capital T and F required","Truthy/falsy: 0, 0.0, '', [], {}, (), None, False are falsy","Comparison: ==, !=, >, <, >=, <=","Logical: and, or, not","Chained comparisons: 0 <= x <= 100","Identity: is, is not — for None/True/False only","Membership: in, not in","if / elif / else — only first True branch runs","Ternary: value = x if cond else y","Match statement (Python 3.10+)","Short-circuit evaluation","Order of conditions matters — specific before general"],
   qna:[
     {q:"What values are falsy in Python?",a:"Falsy values: 0, 0.0, 0j (complex), '' (empty string), [] (empty list), {} (empty dict or set), () (empty tuple), range(0), None, False. Literally everything else is truthy — even '0' and [0] are truthy.",code:"falsy = [0, 0.0, '', [], {}, (), None, False]\nfor v in falsy:\n    if not v: print(f'{repr(v):15} → falsy')\n\n# Surprise: these are TRUTHY\nif [0]:  print('truthy')   # [0] has one item!\nif '0':  print('truthy')   # non-empty string!"},
     {q:"Why is 'if marks == 75 or 80' always True?",a:"Python evaluates as (marks == 75) or (80). The integer 80 is truthy, so the second operand is always True, making the whole expression always True regardless of marks.",code:"# WRONG — always True:\nif marks == 75 or 80:\n\n# CORRECT options:\nif marks == 75 or marks == 80:\nif marks in (75, 80):\nif marks in {75, 80}:  # set lookup, faster"},
     {q:"What is short-circuit evaluation?",a:"Python stops evaluating as soon as the result is known. In 'A and B', if A is False, B is never evaluated. In 'A or B', if A is True, B is never evaluated. Used to prevent errors.",code:"# Safe null check — won't crash if data is None\nif data is not None and data['marks'] > 60:\n    pass\n\n# OR for default:\nname = user_input or 'Anonymous'  # if input is empty"},
     {q:"How does the match statement work?",a:"Match (Python 3.10+) is a pattern-matching statement. More powerful than switch/case — it can match values, types, structures. Use _ as the wildcard/default case.",code:"match command:\n    case 'quit':\n        exit()\n    case 'help' | '?':\n        show_help()\n    case str(s) if s.startswith('/'):\n        run_command(s)\n    case _:\n        print('Unknown command')"}
   ],
   assignment:{title:"Multi-Stage Eligibility System",desc:"Build a comprehensive eligibility checker for a data analytics certification program.",tasks:["Collect via input(): age, marks%, years_experience, has_python_cert (yes/no), city","Validate each separately: age 22-40, marks >= 65, exp >= 1, cert is yes/no only — raise informative messages for invalid input","Print individual PASS/FAIL for each of the 4 criteria with reason","Overall eligibility: ALL criteria must pass","Use match on years_experience to assign tier: 0='Trainee', 1-2='Junior', 3-5='Mid', 6+='Senior'","Bonus: ternary for fee_waiver = 'Yes' if marks >= 90 else 'No'","Bonus: chain comparison: print whether marks are in 'excellent range': 80 <= marks <= 100"]}

     {q:"Why is NumPy dramatically faster than Python lists for math?",a:"Python lists store Python objects — each with type info, reference count, and value. Lists are arrays of pointers. NumPy arrays store raw values in contiguous C memory, all of the same type. Operations are C loops with no Python overhead per element.",code:"import numpy as np, time\n\ndata = list(range(1_000_000))\nt0 = time.time()\nresult = [x*1.18 for x in data]  # Python loop\nprint(f'List: {time.time()-t0:.3f}s')  # ~0.1s\n\narr = np.array(data, dtype=float)\nt0 = time.time()\nresult = arr * 1.18   # vectorised\nprint(f'NumPy: {time.time()-t0:.4f}s')  # ~0.001s"},
     {q:"What is the Copy vs View problem — show me the bug?",a:"A slice of a NumPy array returns a VIEW — it shares the same underlying data. Modifying the view modifies the original. Use .copy() to get an independent copy.",code:"arr = np.array([1, 2, 3, 4, 5])\n\nview = arr[1:3]    # VIEW — shares memory!\nview[0] = 99\nprint(arr)  # [1, 99, 3, 4, 5] — CHANGED!\n\narr = np.array([1, 2, 3, 4, 5])  # reset\ncopy = arr[1:3].copy()  # independent copy\ncopy[0] = 99\nprint(arr)  # [1, 2, 3, 4, 5] — unchanged ✓"},

     {q:"reshape(-1, 3) — what does -1 mean?",a:"-1 tells NumPy: 'figure out this dimension yourself'. Given the total number of elements and the other dimensions you specified, NumPy computes what -1 must be. Only one dimension can be -1.",code:"arr = np.arange(24)\narr.reshape(-1, 3)   # shape (8,3)  — NumPy found 8\narr.reshape(4, -1)   # shape (4,6)  — NumPy found 6\narr.reshape(2,-1,3)  # shape (2,4,3)— NumPy found 4"},
     {q:"flatten() vs ravel() — which is safer?",a:"flatten() always returns a copy — safe to modify without affecting the original. ravel() returns a view when possible (faster, less memory) but changing it may change the original. Use flatten() when in doubt.",code:"matrix = np.array([[1,2],[3,4]])\nf = matrix.flatten()   # copy — always safe\nf[0] = 99\nprint(matrix[0,0])     # 1 — unchanged ✓\n\nr = matrix.ravel()     # view!\nr[0] = 99\nprint(matrix[0,0])     # 99 — changed!"},
     {q:"What does argsort() return and how do I use it?",a:"argsort() returns the INDICES that would sort the array — not the values themselves. The index at position 0 in the result is the index of the smallest element.",code:"marks = np.array([78, 95, 61, 88, 72])\norder = np.argsort(marks)   # [2, 4, 0, 3, 1]\n# Index 2 (value 61) is smallest\n\n# Get sorted values:\nmarks[order]  # [61, 72, 78, 88, 95]\n\n# Rank from highest:\nmarks[order[::-1]]  # [95, 88, 78, 72, 61]"},
     {q:"hstack vs vstack — which stacks columns and which stacks rows?",a:"vstack = vertical stack = adds new ROWS (stack top-to-bottom like stacking papers). hstack = horizontal stack = adds new COLUMNS (stack left-to-right like opening books side by side).",code:"a = np.array([[1,2],[3,4]])   # shape (2,2)\nb = np.array([[5,6],[7,8]])   # shape (2,2)\n\nnp.vstack([a,b])  # shape (4,2) — rows stacked\nnp.hstack([a,b])  # shape (2,4) — cols stacked"}

   qna:[
     {q:"Why must I always set np.random.seed()?",a:"Without a seed, every run produces different random numbers — your analysis is not reproducible. Anyone who runs your code gets different results. One fixed seed at the top of every script/notebook solves this. Any integer works.",code:"import numpy as np\nnp.random.seed(42)  # ← top of EVERY script!\n\nmarks = np.random.normal(loc=65, scale=15, size=200)\n# Same results every time you run this"},
     {q:"Normal vs Poisson — which distribution for which data?",a:"Normal (Gaussian): continuous measurements that cluster around a mean — exam marks, heights, temperatures, errors. Poisson: count of discrete events in a fixed interval — daily sales, website requests per minute, typos per page.",code:"# Exam marks (0-100, clusters around 65)\nmarks = np.random.normal(loc=65, scale=15, size=500)\nmarks = np.clip(marks, 0, 100)  # bound to valid range\n\n# Daily website visits (discrete counts)\nvisits = np.random.poisson(lam=5000, size=90)"},
     {q:"rand() vs randn() — what is the difference?",a:"rand(n) produces n values from uniform distribution between 0 and 1 (equally likely anywhere). randn(n) produces n values from standard normal distribution (mean=0, std=1 — bell curve centred at 0).",code:"np.random.rand(5)     # [0.37, 0.95, 0.73, ...]  uniform 0-1\nnp.random.randn(5)    # [-0.3, 1.2, 0.05, ...]  standard normal\n\n# Custom normal distribution:\nmu, sigma = 65, 15\ncustom = mu + sigma * np.random.randn(500)  # same as normal(65,15,500)"},
     {q:"What is np.random.choice() useful for in data analysis?",a:"Sampling: select N random items from an array. Essential for creating train/test splits, bootstrapping, cross-validation, simulating random draws.",code:"students = np.array(['Alice','Bob','Charlie','Diana','Eve'])\n\n# Select 3 without replacement (like drawing names):\nselected = np.random.choice(students, size=3, replace=False)\n\n# Bootstrap (with replacement):\ndata = np.random.normal(65, 15, 100)\nbootstrap = np.random.choice(data, size=len(data), replace=True)"}

  {id:"m15",num:"15",title:"NumPy ufuncs",subtitle:"Universal Functions — Arithmetic, Math, Set Operations",track:"np",
   topics:["What is a ufunc — element-wise C-speed operations","np.add, subtract, multiply, divide, power, mod","np.round_, floor, ceil, trunc — rounding family","np.log, log2, log10, exp, expm1, exp2","np.sqrt, cbrt, abs, sign","np.sin, cos, tan — degrees: np.deg2rad first","np.sinh, cosh, tanh hyperbolic","np.cumsum, cumprod — running totals","np.diff — differences between consecutive elements","np.lcm, gcd — element-wise (NumPy 1.15+)","np.union1d, intersect1d, setdiff1d, in1d","np.frompyfunc() and np.vectorize()"],
   qna:[
     {q:"What makes something a ufunc vs a regular function?",a:"A ufunc (universal function) operates element-wise on arrays using compiled C/Fortran code. They support broadcasting, type casting, and are much faster than Python loops or vectorize().",code:"arr = np.array([4, 9, 16, 25, 36])\nnp.sqrt(arr)   # array([2., 3., 4., 5., 6.])\n# Equivalent loop — ~100x slower:\n[math.sqrt(x) for x in arr]"},
     {q:"What is np.cumsum() and when is it useful?",a:"Cumulative sum: each element is the sum of all elements up to and including that position. Used for running totals, cumulative revenue, tracking progress toward a goal.",code:"daily = np.array([100, 150, 120, 200, 180])\nrunning = np.cumsum(daily)\n# array([100, 250, 370, 570, 750])\nprint(f'Total: {running[-1]}')  # 750\nprint(f'Halfway: {running[len(running)//2]}')"},
     {q:"What does np.diff() compute?",a:"The difference between consecutive elements: result[i] = arr[i+1] - arr[i]. The output has one fewer element than input. Used for detecting changes, trends, growth rates.",code:"prices = np.array([100, 110, 105, 120, 115])\nchanges = np.diff(prices)\n# array([10, -5, 15, -5])\n\n# Percentage growth rate:\ngrowth_pct = np.diff(prices) / prices[:-1] * 100\n# array([10.0, -4.55, 14.29, -4.17])"},
     {q:"How do I vectorise my own Python function?",a:"np.vectorize() wraps any Python function so it can accept array inputs. Slower than true C ufuncs but convenient for custom logic. np.frompyfunc() is similar but returns object arrays.",code:"def my_grade(mark):\n    if mark >= 90: return 'A'\n    elif mark >= 75: return 'B'\n    return 'C'\n\nvec_grade = np.vectorize(my_grade)\nmarks = np.array([88, 92, 65, 78, 95])\nprint(vec_grade(marks))  # ['B' 'A' 'C' 'B' 'A']"}

     {q:"Figure vs Axes — what is the difference?",a:"Figure is the entire canvas/window. Axes is one plot panel inside the Figure. A Figure can contain multiple Axes (subplots). For anything beyond a single chart, use fig, ax = plt.subplots() and work with the ax object.",code:"fig, ax = plt.subplots(figsize=(10, 5))\nax.plot(months, revenue, label='Revenue')\nax.set_title('Monthly Revenue')\nax.set_xlabel('Month')\nax.set_ylabel('Revenue (₹)')\nax.legend()\nfig.savefig('chart.png', dpi=150)\nplt.show()"},
     {q:"Why MUST savefig() come before show()?",a:"plt.show() renders the figure to the screen AND then clears the figure buffer. If you call savefig() afterwards, you save a blank white image. Always call savefig() first, then show().",code:"plt.plot(months, revenue, marker='o')\nplt.title('Sales Trend')\nplt.grid(alpha=0.3)\nplt.tight_layout()\n# ✓ SAVE FIRST:\nplt.savefig('trend.png', dpi=150, bbox_inches='tight')\n# ✓ SHOW AFTER:\nplt.show()"},
     {q:"How do I add multiple lines to one chart?",a:"Call plt.plot() or ax.plot() multiple times before show(). Each call adds another line. Use label= on each call and plt.legend() to show the key.",code:"plt.plot(months, revenue, label='Revenue',\n         color='steelblue', linewidth=2)\nplt.plot(months, costs, label='Costs',\n         color='coral', linestyle='--', linewidth=2)\nplt.plot(months, profit, label='Profit',\n         color='seagreen', marker='o')\nplt.legend()\nplt.show()"},

   qna:[
     {q:"Line chart vs Scatter — how do I choose?",a:"Line chart: data points have a meaningful order (time series, progression). The line implies continuity between points. Scatter: two independent variables where you want to see the relationship or correlation. Never connect random scatter points with a line.",code:"# Time series → LINE (order matters)\nplt.plot(dates, prices)\n\n# Correlation → SCATTER (order doesn't matter)\nplt.scatter(study_hours, exam_marks, alpha=0.6)\n\n# Both: scatter + trend line\nplt.scatter(x, y, alpha=0.4)\nplt.plot(x, np.poly1d(np.polyfit(x,y,1))(x))"},
     {q:"How many histogram bins is the right number?",a:"Start with bins='auto' and let matplotlib decide. For manual: sqrt(n) for n data points is a common rule. Too few = hides the shape. Too many = noisy. Experiment with 10, 20, 30 and pick the clearest.",code:"marks = np.random.normal(65, 15, 200)\n\nplt.hist(marks, bins='auto', edgecolor='white')  # auto\nplt.hist(marks, bins=15, edgecolor='white')      # manual\nplt.hist(marks, bins=15, density=True)           # probability density\nplt.axvline(marks.mean(), color='red', linestyle='--', label='Mean')"},
     {q:"When should I avoid pie charts?",a:"Avoid pie when: more than 4-5 segments (humans can't accurately compare slice sizes), differences between values are small, you want to compare across time or categories. A horizontal bar chart is almost always clearer than a pie.",code:"# Prefer this for 6+ categories:\nplt.barh(categories, values, color='steelblue')\nplt.xlabel('Value')\n\n# Pie OK for 2-4 segments, clear part-to-whole:\nplt.pie([60, 25, 15], labels=['A','B','C'],\n        autopct='%1.1f%%', startangle=90)"},
     {q:"How do I access individual Axes in a subplots grid?",a:"plt.subplots(2,3) returns a 2D numpy array of Axes objects. Access each with axes[row, col]. For a single row: it's 1D, use axes[col]. Use ax.set_title(), ax.plot() etc. — not plt.title() or plt.plot() inside subplot loops.",code:"fig, axes = plt.subplots(2, 2, figsize=(12, 8))\naxes[0,0].plot(x, y1, color='steelblue')\naxes[0,0].set_title('Revenue Trend')\naxes[0,1].bar(cats, vals, color='coral')\naxes[1,0].hist(data, bins=15)\naxes[1,1].scatter(a, b, alpha=0.5)\nfig.suptitle('Sales Dashboard', fontsize=16)\nplt.tight_layout()"}

   topics:["Series: 1D labelled array — one column with index","DataFrame: 2D labelled table","Index: row labels, default 0,1,2...","Creating from dict, list, NumPy array","df.shape, ndim, size, dtypes, columns, index","df.head(n), tail(n), sample(n)","df.info() — structure and nulls","df.describe() — statistics, include='all'","pd.read_csv() — key params: sep, header, index_col, usecols, nrows, skiprows, encoding","pd.read_json() from file or URL","pd.read_excel() — sheet_name","df.to_csv(index=False), to_json(), to_excel()"],
   qna:[
     {q:"What is the pandas Index and why does it matter?",a:"The index labels each row — like a spreadsheet row number but can be any value. Default is 0,1,2... You can set a column as index with set_index(). This controls how loc[] looks up rows and how merge() and concat() align data.",code:"df = pd.read_csv('students.csv')\ndf.set_index('student_id', inplace=True)\n\n# Now loc uses student_id:\ndf.loc['STU001']         # one student\ndf.loc['STU001':'STU005'] # range by ID\n\n# Reset to numeric index:\ndf.reset_index(inplace=True)"},
     {q:"df.info() vs df.describe() — which tells me what?",a:"info() is structural: column names, dtypes, non-null counts, memory. Answers: are there nulls? are dtypes correct? describe() is statistical: mean, std, min, max, percentiles. Answers: what do the values look like? Always run BOTH after loading data.",code:"df.info()\n# RangeIndex: 1000 entries\n# marks    1000 non-null float64  ← no nulls\n# city      987 non-null object   ← 13 nulls!\n\ndf.describe()\n# marks: mean=65.3, std=14.8, min=12, max=100\n\ndf.describe(include='all')  # includes text columns too"},
     {q:"How do I read only certain columns from a large CSV?",a:"Use usecols= to load only the columns you need. Combined with nrows= for quick previewing, this is essential for large files — saves memory and time.",code:"# Preview structure first:\ndf_preview = pd.read_csv('big_file.csv', nrows=5)\nprint(df_preview.columns.tolist())\n\n# Load only what you need:\ndf = pd.read_csv('big_file.csv',\n    usecols=['date', 'product', 'revenue', 'profit'],\n    encoding='utf-8')"},
     {q:"Series vs DataFrame — when does each appear?",a:"df['marks'] returns a Series — one column. df[['name','marks']] returns a DataFrame — multiple columns. Functions like groupby().agg() return DataFrames. value_counts() returns a Series. Knowing which you have determines what operations are available.",code:"s = df['marks']       # Series\nprint(type(s))        # pandas.core.series.Series\nprint(s.mean())       # works on Series\n\ndf2 = df[['name','marks']]  # DataFrame (double [[]])\nprint(type(df2))      # pandas.core.frame.DataFrame"}

  {id:"m19",num:"19",title:"Pandas Filtering & Selection",subtitle:"Analyzing Data, loc, iloc, Boolean filters, value_counts",track:"pd",
   topics:["df['col'] for single column (Series)","df[['c1','c2']] for multiple columns (DataFrame)","loc[row_label, col_label] — label-based","iloc[row_int, col_int] — position-based","Boolean filter: df[df['marks'] > 60]","Multiple conditions: & and | (NOT 'and'/'or')","Parentheses REQUIRED: (cond1) & (cond2)","~ for NOT in pandas","query() for readable SQL-like filters","isin() — check against a list of values","between() — inclusive range filter","nlargest(n), nsmallest(n)","value_counts() and value_counts(normalise=True)"],
   qna:[
     {q:"Why & instead of 'and' for pandas filters?",a:"Python's 'and' works on single True/False values. & is a bitwise operator that works element-wise on Series (column by column). pandas requires & for combining boolean columns. Also: parentheses around each condition are REQUIRED.",code:"# WRONG — Python 'and' can't compare Series:\ndf[df['age'] > 20 and df['city'] == 'Mumbai']  # ValueError!\n\n# CORRECT — & works element-wise:\ndf[(df['age'] > 20) & (df['city'] == 'Mumbai')]  # ✓\n\n# WRONG — no parentheses causes wrong precedence:\ndf[df['age'] > 20 & df['city'] == 'Mumbai']  # buggy!"},
     {q:"loc vs iloc — give me a clear example with a non-default index?",a:"When the index is not 0,1,2... the difference is obvious. loc uses the actual index labels. iloc always uses 0,1,2... positions regardless.",code:"df = pd.DataFrame({'name':['A','B','C'],'marks':[88,72,95]},\n                   index=['S01','S02','S03'])\n\ndf.loc['S01']         # row with label 'S01' → A, 88\ndf.iloc[0]            # first row by position → also A, 88\n\ndf.loc['S02','marks'] # row 'S02', column 'marks' → 72\ndf.iloc[1, 1]         # position row 1, col 1 → also 72"},
     {q:"What is value_counts() and why is it the most used EDA function?",a:"value_counts() counts occurrences of each unique value in a column. Instant distribution summary for any categorical column. With normalise=True shows proportions. Returns a Series sorted by count descending.",code:"df['city'].value_counts()\n# Mumbai    245\n# Delhi     189\n# Pune       87\n\ndf['city'].value_counts(normalise=True).head(5)\n# Mumbai    0.245\n# Delhi     0.189\n\ndf['grade'].value_counts().plot.bar()  # quick chart"},
     {q:"What does query() do and when is it better than boolean indexing?",a:"query() accepts a SQL-like string expression. Better than long boolean chains for complex conditions. You can reference external variables with @varname. Less typing, more readable.",code:"threshold = 60\ncity = 'Mumbai'\n\n# Boolean indexing:\ndf[(df['marks'] > threshold) & (df['city'] == city)]\n\n# query() — more readable:\ndf.query('marks > @threshold and city == @city')\n\n# Even cleaner for complex:\ndf.query('marks > 60 and city in [\"Mumbai\",\"Pune\"] and age < 25')"}

  {id:"m20",num:"20",title:"Pandas Data Cleaning",subtitle:"Cleaning Empty Cells, Wrong Format, Wrong Data, Removing Duplicates",track:"pd",
   topics:["df.isnull() and notnull() — element-wise","isnull().sum() — null count per column","isnull().sum() / len(df) — null percentage","dropna(): how='any'/'all', subset=, thresh=","fillna(): scalar, column mean/median/mode, ffill, bfill","pd.to_numeric(errors='coerce') — key for dirty data","pd.to_datetime(errors='coerce') — parse dates","df.str.strip(), lower(), upper(), replace()","Column name normalisation","clip() — bounding outliers to valid range","duplicated() — show duplicate rows","drop_duplicates(): keep, subset parameters","replace() for value mapping","Document every cleaning decision with comments"],
   qna:[
     {q:"When should I drop vs fill missing values?",a:"Fill when: missing is random and you have a good estimate (median for skewed numeric, mode for categorical, ffill/bfill for time series). Drop when: the key identifier is missing (no student ID = useless row), or when less than 5% of rows are affected.",code:"# Fill numeric — use median (robust to outliers):\ndf['marks'].fillna(df['marks'].median(), inplace=True)\n\n# Fill categorical — use mode (most common):\ndf['city'].fillna(df['city'].mode()[0], inplace=True)\n\n# Fill time series — forward fill:\ndf['temperature'].fillna(method='ffill', inplace=True)\n\n# Drop only if key field is null:\ndf.dropna(subset=['student_id'], inplace=True)"},
     {q:"What does errors='coerce' do in pd.to_numeric()?",a:"Without errors='coerce', ONE non-numeric value in the column raises an error and the entire conversion fails. With errors='coerce', any value that can't be converted becomes NaN instead. You can then handle those NaN values separately.",code:"# Without coerce — ONE bad value crashes everything:\ndf['marks'] = pd.to_numeric(df['marks'])  # ValueError if 'N/A' exists\n\n# With coerce — bad values become NaN:\ndf['marks'] = pd.to_numeric(df['marks'], errors='coerce')\n# 'N/A' → NaN, '88' → 88.0\nprint(f'{df[\"marks\"].isnull().sum()} values became NaN')"},
     {q:"How do I clean all column names in one line?",a:"Chain string methods on df.columns. Strip whitespace, convert to lowercase, replace spaces with underscores, remove special characters.",code:"df.columns = (\n    df.columns\n    .str.strip()                         # remove surrounding spaces\n    .str.lower()                         # all lowercase\n    .str.replace(' ', '_', regex=False)  # spaces to underscores\n    .str.replace('[^a-z0-9_]', '', regex=True)  # remove special chars\n)\nprint(df.columns.tolist())"},
     {q:"drop_duplicates() — which row is kept and how do I control it?",a:"Default keeps='first' — the first occurrence is kept. Use keep='last' for the last, keep=False to remove ALL duplicates. Use subset= to check duplicates on specific columns only (e.g. same email from different devices).",code:"# Remove full-row duplicates:\ndf.drop_duplicates(inplace=True)\n\n# By email only (keep first):\ndf.drop_duplicates(subset=['email'], keep='first')\n\n# See what would be dropped:\nduplicates = df[df.duplicated(subset=['email'], keep=False)]\nprint(f'{len(duplicates)} duplicate rows found')"}

     {q:"GroupBy agg() vs transform() — this confuses everyone?",a:"agg() REDUCES each group to one row — you get a summary table with one row per group value. transform() BROADCASTS group statistics back to every original row, keeping the DataFrame's original shape.",code:"# agg: get one row per department\nsummary = df.groupby('dept')['salary'].agg(\n    avg_salary=('salary','mean'),\n    headcount=('salary','count'))\n# shape: (n_depts, 2) — smaller than original!\n\n# transform: add group info back to every row\ndf['dept_avg'] = df.groupby('dept')['salary'].transform('mean')\n# df still has same number of rows!"},
     {q:"merge() vs concat() — how do I know which to use?",a:"merge() joins two tables based on matching key values (SQL JOIN). concat() stacks rows or columns without key matching (SQL UNION ALL). Combining different datasets that share IDs = merge. Combining same dataset across time periods = concat.",code:"# JOIN — match on product_id:\npd.merge(orders, products, on='product_id', how='left')\n# left join: keep ALL orders, add product info where available\n\n# UNION — stack months together:\npd.concat([jan_df, feb_df, mar_df], ignore_index=True)"},

     {q:"What does a boxplot actually show?",a:"Bottom whisker: minimum (or 1.5×IQR from Q1). Q1: 25th percentile. Box: middle 50% (IQR). Median line: 50th percentile. Q3: 75th percentile. Top whisker: maximum (or 1.5×IQR from Q3). Dots: outliers beyond 1.5×IQR.",code:"sns.boxplot(data=df, x='category', y='revenue')\n# Shows median, spread, outliers per category\n\n# Side-by-side with violin for more detail:\nfig, axes = plt.subplots(1, 2, figsize=(14,5))\nsns.boxplot(data=df, x='cat', y='val', ax=axes[0])\nsns.violinplot(data=df, x='cat', y='val', ax=axes[1])"},
     {q:"What is a pairplot and when should I use it?",a:"pairplot shows scatter plots for every pair of numeric columns (off-diagonal) and histograms (on-diagonal). One call reveals all pairwise relationships. Use at the start of EDA. Slow for large datasets — sample first.",code:"# Sample first for speed:\nsample = df.sample(500, random_state=42)\n\nsns.pairplot(\n    sample,\n    hue='category',  # color by category\n    corner=True,     # show only lower triangle\n    plot_kws={'alpha': 0.4}\n)"},

// ── STATE ──
let current = -1;
let checked = JSON.parse(localStorage.getItem('pda_checked2') || '{}');

function save() { localStorage.setItem('pda_checked2', JSON.stringify(checked)); }

function totalTopics() {
  return MODULES.reduce((a,m) => a + m.topics.length, 0);
}
function doneTopics() {
  return Object.values(checked).filter(Boolean).length;
}
function moduleDone(m) {
  return m.topics.every((_,i) => checked[`${m.id}-${i}`]);
}

// ── SIDEBAR ──
function buildSidebar() {
  const done = doneTopics(), total = totalTopics();
  const pct = Math.round(done/total*100);
  document.getElementById('done-n').textContent = MODULES.filter(moduleDone).length;
  document.getElementById('pct-n').textContent = pct + '%';
  document.getElementById('prog-label').textContent = `${done} / ${total} topics`;
  document.getElementById('prog-fill').style.width = pct + '%';

  const tracks = {py:'Python',np:'NumPy',mp:'Matplotlib',pd:'Pandas'};
  const groups = {};
  MODULES.forEach(m => { if(!groups[m.track]) groups[m.track]=[]; groups[m.track].push(m); });

  const nav = document.getElementById('sb-nav');
  nav.innerHTML = Object.entries(groups).map(([track,mods]) => `
    <div class="sb-track">${tracks[track]}</div>
    ${mods.map(m => `
      <div class="sb-item ${m.id === (current>=0?MODULES[current].id:null) ? 'active' : ''}"
           onclick="goModule(${MODULES.indexOf(m)})">
        <span class="sb-item-num">${m.num}</span>
        <span class="sb-item-label">${m.title}</span>
        <span class="sb-check ${moduleDone(m)?'done':''}">✓</span>
      </div>`).join('')}
  `).join('');
}

// ── WELCOME ──
function showWelcome() {
  document.getElementById('page-welcome').style.display='block';
  document.getElementById('page-module').style.display='none';
  current = -1;
  const done = doneTopics(), total = totalTopics();
  document.getElementById('page-welcome').innerHTML = `
    <div class="welcome">
      <div class="welcome-hero">
        <div class="welcome-tag">Complete Python Curriculum · 23 Modules</div>
        <div class="welcome-title">Python for<br>Data Analysts</div>
        <div class="welcome-desc">From complete Python beginner to job-ready data analyst. Covers Python fundamentals, NumPy, Matplotlib, and Pandas — with Q&A and assignments for every module.</div>
      </div>
      <div class="welcome-grid">
        <div class="track-card tc-py">
          <div class="tc-title">Python Fundamentals</div>
          <div class="tc-sub">Modules 01–11 · The complete language</div>
          <div class="tc-mods">Syntax · Types · Strings · Loops · Functions · OOP · Modules · RegEx</div>
        </div>
        <div class="track-card tc-np">
          <div class="tc-title">NumPy</div>
          <div class="tc-sub">Modules 12–15 · Numerical computing</div>
          <div class="tc-mods">Arrays · Indexing · Reshape · Random · Distributions · ufuncs</div>
        </div>
        <div class="track-card tc-mp">
          <div class="tc-title">Matplotlib</div>
          <div class="tc-sub">Modules 16–17 · Visualisation</div>
          <div class="tc-mods">Line · Bar · Scatter · Histogram · Pie · Subplots · Dashboards</div>
        </div>
        <div class="track-card tc-pd">
          <div class="tc-title">Pandas + Seaborn</div>
          <div class="tc-sub">Modules 18–23 · Data analysis</div>
          <div class="tc-mods">DataFrames · Cleaning · GroupBy · Merge · Seaborn · Capstone</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px">
        <div style="flex:1;height:6px;background:#f0ede8;border-radius:3px;overflow:hidden">
          <div style="height:100%;width:${Math.round(done/total*100)}%;background:linear-gradient(90deg,#2563eb,#16a34a,#7c3aed);border-radius:3px;transition:width .4s"></div>
        </div>
        <span style="font-size:12px;color:var(--ink3);white-space:nowrap;font-family:var(--mono)">${done}/${total} topics</span>
      </div>
      <button class="start-btn" onclick="goModule(0)">Start with Module 01 →</button>
    </div>`;
  buildSidebar();
}

// ── MODULE PAGE ──
function goModule(idx) {
  current = idx;
  const m = MODULES[idx];
  document.getElementById('page-welcome').style.display='none';
  document.getElementById('page-module').style.display='block';

  const trackColor = {py:'var(--py)',np:'var(--np)',mp:'var(--mp)',pd:'var(--pd)'}[m.track];
  const trackName = {py:'Python',np:'NumPy',mp:'Matplotlib',pd:'Pandas'}[m.track];

  document.getElementById('page-module').innerHTML = `
    <div class="pg-header">
      <div class="pg-eyebrow">
        <span class="pg-track-badge badge-${m.track}">${trackName}</span>
        <span class="pg-num">Module ${m.num} of ${MODULES.length}</span>
      </div>
      <div class="pg-title">${m.title}</div>
      <div class="pg-subtitle">${m.subtitle}</div>
      <div class="pg-divider"></div>
    </div>

    <div class="tab-row">
      <button class="tab-btn active" onclick="setTab(this,'tab-topics')">Topics</button>
      <button class="tab-btn" onclick="setTab(this,'tab-qna')">Q&A</button>
      <button class="tab-btn" onclick="setTab(this,'tab-assign')">Assignment</button>
    </div>

    <div class="tab-content active" id="tab-topics">${buildTopics(m)}</div>
    <div class="tab-content" id="tab-qna">${buildQnA(m)}</div>
    <div class="tab-content" id="tab-assign">${buildAssign(m)}</div>

    <div class="pg-nav">
      <button class="nav-btn" onclick="${idx>0?`goModule(${idx-1})`:'showWelcome()'}" ${idx===0?'':''}>
        ← ${idx>0?MODULES[idx-1].title:'Home'}
      </button>
      <span class="pg-pos">${idx+1} / ${MODULES.length}</span>
      <button class="nav-btn primary" onclick="${idx<MODULES.length-1?`goModule(${idx+1})`:'showWelcome()'}" ${idx===MODULES.length-1?'disabled':''}>
        ${idx<MODULES.length-1?MODULES[idx+1].title:'Finish'} →
      </button>
    </div>
  `;

  buildSidebar();
  document.getElementById('main-content').scrollTop = 0;
}

function buildTopics(m) {
  const done = m.topics.filter((_,i) => checked[`${m.id}-${i}`]).length;
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <span style="font-size:12px;color:var(--ink3)">${done}/${m.topics.length} topics covered</span>
      <button onclick="markAllDone('${m.id}',${m.topics.length})" style="font-size:11px;padding:4px 12px;border-radius:6px;border:1px solid var(--border2);background:var(--surface);cursor:pointer;font-family:var(--font)">Mark all done</button>
    </div>
    <div class="topic-grid">
      ${m.topics.map((t,i) => {
        const k=`${m.id}-${i}`, done=checked[k];
        return `<div class="topic-item" onclick="toggleTopic('${m.id}',${i})">
          <div class="topic-cb ${done?'done':''}">✓</div>
          <span class="topic-txt ${done?'done':''}">${t}</span>
        </div>`;
      }).join('')}
    </div>`;
}

function buildQnA(m) {
  return `<div class="qna-list">${m.qna.map((q,i) => `
    <div class="qna-item">
      <div class="qna-q">
        <span class="qna-q-tag">Q${i+1}</span>
        <span class="qna-q-text">${q.q}</span>
      </div>
      <div class="qna-a">${q.a}</div>
      ${q.code?`<pre class="qna-code">${q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/(#[^\n]*)/g,'<span class="code-comment">$1</span>')}</pre>`:''}
    </div>`).join('')}</div>`;
}

function buildAssign(m) {
  return `<div class="assign-card">
    <div class="assign-eyebrow">Module ${m.num} Assignment</div>
    <div class="assign-title">${m.assignment.title}</div>
    <div class="assign-desc">${m.assignment.desc}</div>
    <ul class="assign-tasks">
      ${m.assignment.tasks.map((t,i) => `
        <li class="assign-task">
          <span class="assign-task-n">${String(i+1).padStart(2,'0')}.</span>
          ${t}
        </li>`).join('')}
    </ul>
  </div>`;
}

// ── INTERACTIONS ──
function setTab(btn, id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(id).classList.add('active');
}

function toggleTopic(moduleId, idx) {
  const k = `${moduleId}-${idx}`;
  checked[k] = !checked[k];
  save();
  if(current >= 0) goModule(current);
  else buildSidebar();
}

function markAllDone(moduleId, count) {
  for(let i=0;i<count;i++) checked[`${moduleId}-${i}`] = true;
  save();
  if(current >= 0) goModule(current);
}

// ── INIT ──
showWelcome();
</script>
